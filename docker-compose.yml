services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-job-board-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dev_job_board
    ports:
      # Host port 5435 to avoid clashing with a local Postgres on the default
      # 5432. The container still listens on 5432 internally.
      - '5435:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dev_job_board']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
